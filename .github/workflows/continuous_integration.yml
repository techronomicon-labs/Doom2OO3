name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pf_oracle:
    name: PF renderer contract oracle
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      native: ${{ steps.route.outputs.native }}
      actors: ${{ steps.route.outputs.actors }}
      materials: ${{ steps.route.outputs.materials }}
      resources: ${{ steps.route.outputs.resources }}
      lightmaps: ${{ steps.route.outputs.lightmaps }}
      portals: ${{ steps.route.outputs.portals }}
      lighting: ${{ steps.route.outputs.lighting }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Validate CI routing and negative controls
      run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

    - name: Validate SHADOW-001 synthetic demo and negative controls
      run: python3 -m unittest discover -s tools/shadow001/tests -v

    - name: Select routine and targeted coverage from exact changed paths
      id: route
      shell: bash
      run: |
        python3 tools/ci/route.py --event-path "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --out build/ci-routing.json --github-output "$GITHUB_OUTPUT"
        cat build/ci-routing.json >> "$GITHUB_STEP_SUMMARY"

    - name: Reject missing or malformed routing outputs
      shell: bash
      env:
        ROUTE_NATIVE: ${{ steps.route.outputs.native }}
        ROUTE_ACTORS: ${{ steps.route.outputs.actors }}
        ROUTE_MATERIALS: ${{ steps.route.outputs.materials }}
        ROUTE_RESOURCES: ${{ steps.route.outputs.resources }}
        ROUTE_LIGHTMAPS: ${{ steps.route.outputs.lightmaps }}
        ROUTE_PORTALS: ${{ steps.route.outputs.portals }}
        ROUTE_LIGHTING: ${{ steps.route.outputs.lighting }}
      run: |
        set -euo pipefail
        for route_value in "$ROUTE_NATIVE" "$ROUTE_ACTORS" "$ROUTE_MATERIALS" "$ROUTE_RESOURCES" "$ROUTE_LIGHTMAPS" "$ROUTE_PORTALS" "$ROUTE_LIGHTING"; do
          case "$route_value" in true|false) ;; *) echo 'Missing/invalid CI routing output'; exit 1 ;; esac
        done

    - name: Run CPU contracts and deterministic oracle
      run: python3 tools/check.py --output build/pf-oracle

    - name: Upload check logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cpu-contract-checks
        retention-days: ${{ job.status == 'success' && 7 || 30 }}
        path: |
          build/ci-routing.json
          build/pf-oracle/*.log
          build/pf-oracle/renderer-corpus/result.json
          build/pf-oracle/renderer-corpus/prepare-*/prepared.json

  build:
    name: ${{ matrix.config.name }} | ${{ matrix.config.build_type }}
    needs: pf_oracle
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Visual Studio 2022
          os: windows-2022
          build_type: RelWithDebInfo

        - name: Visual Studio 2022
          os: windows-2022
          build_type: Debug

        - name: macOS
          os: macos-15
          deps_cmdline: brew install libvpx
          build_type: Release

        - name: macOS
          os: macos-15
          extra_options: -G Xcode -DDYN_OPENAL=OFF
          deps_cmdline: brew install libvpx
          build_type: Debug

        - name: Linux GCC 12
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12
          deps_cmdline: sudo apt update && sudo apt install libsdl2-dev libvpx-dev libgtk-3-dev libwebp-dev
          build_type: RelWithDebInfo

        - name: Linux Clang 11
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-11 -DCMAKE_CXX_COMPILER=clang++-11 -DDYN_OPENAL=OFF
          deps_cmdline: sudo apt update && sudo apt install clang-11 libsdl2-dev libvpx-dev libopenal-dev libwebp-dev
          build_type: Debug

        - name: Linux Clang 15
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-15 -DCMAKE_CXX_COMPILER=clang++-15
          deps_cmdline: sudo apt update && sudo apt install clang-15 libsdl2-dev libvpx-dev libwebp-dev
          build_type: Release

        - name: Linux software Vulkan
          # Required CI critical path: GitHub-hosted software Vulkan; do not duplicate this job.
          os: ubuntu-24.04
          extra_options: -DNO_GTK=ON
          deps_cmdline: sudo apt update && sudo apt install libsdl2-dev libvpx-dev libdbus-1-dev libbz2-dev libx11-dev libwebp-dev mesa-vulkan-drivers vulkan-tools xvfb xauth freedoom xz-utils
          build_type: RelWithDebInfo
          native_renderer: true

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Select Python for Windows CPU containment controls
      if: runner.os == 'Windows' && matrix.config.build_type == 'RelWithDebInfo'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build instance worker and qualify fake backend without Vulkan
      if: runner.os == 'Windows' && matrix.config.build_type == 'RelWithDebInfo'
      shell: pwsh
      run: |
        cmake -S tools/physical_supervisor/probe -B build/instance-probe -G "Visual Studio 17 2022" -A x64
        if ($LASTEXITCODE -ne 0) { throw 'Instance-probe configuration failed' }
        cmake --build build/instance-probe --config RelWithDebInfo --parallel 2
        if ($LASTEXITCODE -ne 0) { throw 'Instance-probe build failed' }
        & ./build/instance-probe/RelWithDebInfo/sdvk009_probe_cpu_tests.exe
        if ($LASTEXITCODE -ne 0) { throw 'Fake-backend CPU controls failed' }
        $probeCpuControl = (Resolve-Path ./build/instance-probe/RelWithDebInfo/sdvk009_instance_probe.exe).Path
        "SDVK_CPU_PROBE_CONTROL_EXE=$probeCpuControl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Qualify Windows native supervisor with benign CPU children only
      if: runner.os == 'Windows' && matrix.config.build_type == 'RelWithDebInfo'
      env:
        SDVK_CPU_FAILURE_EVIDENCE_ROOT: ${{ runner.temp }}/sdvk-supervisor-cpu-failures
      run: python -B -m unittest discover -s tools/physical_supervisor -t . -v

    - name: Retain unexpected native CPU fixture failures
      if: failure() && runner.os == 'Windows' && matrix.config.build_type == 'RelWithDebInfo'
      uses: actions/upload-artifact@v4
      with:
        name: supervisor-cpu-failures
        path: ${{ runner.temp }}/sdvk-supervisor-cpu-failures
        if-no-files-found: ignore

    - name: Install Dependencies
      shell: bash
      run: |
        if [[ -n "${{ matrix.config.deps_cmdline }}" ]]; then
          eval ${{ matrix.config.deps_cmdline }}
        fi
        if [[ "${{ runner.os }}" == 'macOS' ]]; then
          python3 tools/fetch_build_deps.py --platform macos --output build/deps
        elif [[ "${{ runner.os }}" == 'Linux' ]]; then
          python3 tools/fetch_build_deps.py --platform linux --output build/deps
        fi

    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DCMAKE_PREFIX_PATH="${PWD}/build/deps/zmusic" -DPK3_QUIET_ZIPDIR=ON ${{ matrix.config.extra_options }}

    - name: Build
      shell: bash
      run: |
        export MAKEFLAGS=--keep-going
        cmake --build build --config ${{ matrix.config.build_type }} --parallel 3

    - name: Verify executable project and commit identity
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
        DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: python3 tools/check_build_identity.py --build-dir build --config ${{ matrix.config.build_type }} --expected-state clean

    - name: Record documentation-only native scope
      if: matrix.config.native_renderer && needs.pf_oracle.outputs.native == 'false'
      run: echo 'Native rendering NOT_APPLICABLE to this documented change set; this job still compiled and verified the exact source.'

    - name: Package SHADOW-001 Windows owner candidate without renderer execution
      if: runner.os == 'Windows' && matrix.config.build_type == 'RelWithDebInfo'
      shell: bash
      run: |
        python tools/shadow001/package_windows.py --runtime build/RelWithDebInfo --resource-root build \
          --out build/SHADOW-001-Windows --expected-commit "$(git rev-parse HEAD)"

    - name: Upload SHADOW-001 Windows owner candidate
      if: runner.os == 'Windows' && matrix.config.build_type == 'RelWithDebInfo'
      uses: actions/upload-artifact@v4
      with:
        name: shadow001-windows-${{ github.event.pull_request.head.sha || github.sha }}
        path: build/SHADOW-001-Windows.zip
        compression-level: 0
        retention-days: 7
        if-no-files-found: error

    - name: Select isolated hosted software Vulkan
      if: matrix.config.native_renderer && needs.pf_oracle.outputs.native == 'true'
      shell: bash
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = github-hosted
        mapfile -t sdvk_icds < <(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json"))))')
        test "${#sdvk_icds[@]}" -eq 1
        {
          printf 'VK_DRIVER_FILES=%s\n' "${sdvk_icds[0]}"
          printf 'VK_ICD_FILENAMES=%s\n' "${sdvk_icds[0]}"
          printf 'SDL_VIDEODRIVER=x11\n'
        } >> "$GITHUB_ENV"

    - name: SHADOW-001 - genuine projected shadow and camera orbit captures
      if: matrix.config.native_renderer && needs.pf_oracle.outputs.native == 'true'
      timeout-minutes: 12
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        xvfb-run -a -s '-screen 0 800x600x24 -nolisten tcp' python3 tools/shadow001/run_demo.py \
          --exe "$PWD/build/vkdoom" --iwad /usr/share/games/doom/freedoom2.wad \
          --out build/shadow001-native --expected-commit "$(git rev-parse HEAD)"

    - name: Retain SHADOW-001 visual evidence and original failures
      if: always() && matrix.config.native_renderer && needs.pf_oracle.outputs.native == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: shadow001-software-vulkan-${{ github.event.pull_request.head.sha || github.sha }}
        path: |
          build/shadow001-native/**
          !build/shadow001-native/**/cache/**
          !build/shadow001-native/**/save/**
          !build/shadow001-native/**/input/**
        retention-days: ${{ job.status == 'success' && 7 || 30 }}
        if-no-files-found: error

    - name: Lane A - bounded renderer OFF/ON and gameplay smoke
      if: matrix.config.native_renderer && needs.pf_oracle.outputs.native == 'true'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
        SDVK_ACTORS: ${{ needs.pf_oracle.outputs.actors }}
        SDVK_MATERIALS: ${{ needs.pf_oracle.outputs.materials }}
        SDVK_PORTALS: ${{ needs.pf_oracle.outputs.portals }}
        SDVK_LIGHTING: ${{ needs.pf_oracle.outputs.lighting }}
      run: |
        set -euo pipefail
        sdvk_extra=()
        if [[ "$SDVK_ACTORS" == true || "$SDVK_PORTALS" == true ]]; then
          sdvk_extra+=(--extra-scene sprite-mirror)
        fi
        if [[ "$SDVK_MATERIALS" == true ]]; then
          sdvk_extra+=(--extra-scene material-stress)
        fi
        if [[ "$SDVK_LIGHTING" == true ]]; then
          sdvk_extra+=(--extra-scene shadow-boundary)
        fi
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 tools/ci/routine_native.py \
          --exe "$PWD/build/vkdoom" --iwad /usr/share/games/doom/freedoom2.wad \
          --out build/renderer-routine --expected-commit "$(git rev-parse HEAD)" "${sdvk_extra[@]}"

    - name: Authenticate targeted suite content
      if: matrix.config.native_renderer && (needs.pf_oracle.outputs.actors == 'true' || needs.pf_oracle.outputs.resources == 'true' || needs.pf_oracle.outputs.lightmaps == 'true' || needs.pf_oracle.outputs.portals == 'true')
      run: python3 tools/renderer_oracle/sdvk009_publication.py fetch-content --out build/renderer-sdvk009-content

    - name: Lane B - actors and sunlight
      if: matrix.config.native_renderer && needs.pf_oracle.outputs.actors == 'true'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk010_acceptance \
          --exe "$PWD/build/vkdoom" --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk010 --expected-commit "$(git rev-parse HEAD)"

    - name: Lane B - probe owner lifetime
      if: matrix.config.native_renderer && needs.pf_oracle.outputs.resources == 'true'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk150_probe_owner \
          --exe "$PWD/build/vkdoom" --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk150 --expected-commit "$(git rev-parse HEAD)"

    - name: Lane B - live sampler and descriptor reset
      if: matrix.config.native_renderer && needs.pf_oracle.outputs.resources == 'true'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk153_probe_reset \
          --exe "$PWD/build/vkdoom" --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk153 --expected-commit "$(git rev-parse HEAD)"

    - name: Lane B - retained lightmap lifecycle
      if: matrix.config.native_renderer && needs.pf_oracle.outputs.lightmaps == 'true'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk158_lightmap_transition \
          --exe "$PWD/build/vkdoom" --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk158 --expected-commit "$(git rev-parse HEAD)"

    - name: Lane B - special surfaces and portals
      if: matrix.config.native_renderer && (needs.pf_oracle.outputs.lightmaps == 'true' || needs.pf_oracle.outputs.portals == 'true')
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk161_special_surfaces \
          --exe "$PWD/build/vkdoom" --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk161 --expected-commit "$(git rev-parse HEAD)"

    - name: Lane B - controlled lightmap planes
      if: matrix.config.native_renderer && needs.pf_oracle.outputs.lightmaps == 'true'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk014_controlled_planes \
          --exe "$PWD/build/vkdoom" --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk014-controlled --expected-commit "$(git rev-parse HEAD)"

    - name: Package bounded native evidence losslessly
      if: always() && matrix.config.native_renderer && needs.pf_oracle.outputs.native == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sdvk_evidence_dirs=()
        for sdvk_evidence_dir in renderer-routine renderer-sdvk009-content renderer-sdvk010 renderer-sdvk150 renderer-sdvk153 renderer-sdvk158 renderer-sdvk161 renderer-sdvk014-controlled; do
          if [[ -d "build/$sdvk_evidence_dir" ]]; then
            sdvk_evidence_dirs+=("$sdvk_evidence_dir")
          fi
        done
        test "${#sdvk_evidence_dirs[@]}" -gt 0
        XZ_OPT='-1 -T0' tar -cJf build/renderer-software-vulkan.tar.xz -C build "${sdvk_evidence_dirs[@]}"
        xz -t build/renderer-software-vulkan.tar.xz
        sha256sum build/renderer-software-vulkan.tar.xz > build/renderer-software-vulkan.sha256
        du -b build/renderer-software-vulkan.tar.xz >> "$GITHUB_STEP_SUMMARY"

    - name: Upload routine and targeted evidence
      if: always() && matrix.config.native_renderer && needs.pf_oracle.outputs.native == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: renderer-software-vulkan
        path: |
          build/renderer-software-vulkan.tar.xz
          build/renderer-software-vulkan.sha256
        compression-level: 0
        retention-days: ${{ job.status == 'success' && 7 || 30 }}
        if-no-files-found: error

    - name: Diagnose macOS startup failure
      if: failure() && runner.os == 'macOS'
      shell: bash
      env:
        DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        runtime="build/vkdoom.app/Contents/MacOS/vkdoom"
        if [[ -f "build/${{ matrix.config.build_type }}/vkdoom.app/Contents/MacOS/vkdoom" ]]; then
          runtime="build/${{ matrix.config.build_type }}/vkdoom.app/Contents/MacOS/vkdoom"
        fi
        lldb --batch -o 'breakpoint set -n __cxa_throw' -o run -o 'thread backtrace all' -- "$runtime" --version
